<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Gemini Live Translate - Manuell VAD (Push-To-Talk)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8 max-w-2xl mx-auto space-y-6 font-sans">
  <h1 class="text-xl font-bold text-blue-400">Gemini Live - Manuell VAD (Push-To-Talk)</h1>

  <div class="bg-slate-800 p-4 rounded-lg space-y-3">
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Gemini API-nyckel:</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full p-2 bg-slate-700 rounded border border-slate-600 outline-none text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Målspråk:</label>
      <input type="text" id="targetLang" value="en" class="w-24 p-2 bg-slate-700 rounded border border-slate-600 outline-none text-sm">
    </div>
  </div>

  <div class="flex justify-center">
    <button id="pttBtn" class="w-full py-8 bg-blue-600 hover:bg-blue-500 active:bg-red-600 font-bold text-lg rounded-xl select-none shadow-lg transition-colors">
      HÅLL IN FÖR ATT TALA (Push-To-Talk)
    </button>
  </div>

  <div class="bg-slate-800 p-4 rounded-lg space-y-2">
    <div id="status" class="text-slate-400 font-mono text-sm">Status: Redo</div>
    <div id="transcript" class="text-green-400 font-sans text-base min-h-[3rem]"></div>
  </div>

  <script>
    const pttBtn = document.getElementById('pttBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const apiKeyInput = document.getElementById('apiKey');
    const targetLangInput = document.getElementById('targetLang');

    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let scriptProcessor = null;
    let isTalking = false;

    // 1. Initiera WebSocket-anslutning med inaktiverad VAD
    function connectWebSocket() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert('Ange din API-nyckel först!');
        return false;
      }

      if (ws && ws.readyState === WebSocket.OPEN) return true;

      statusEl.innerText = 'Status: Ansluter till Gemini WebSocket...';
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${key}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusEl.innerText = 'Status: WebSocket ansluten. Konfigurerar manuell VAD...';
        
        // Setup-meddelande med inaktiverad automatisk VAD
        ws.send(JSON.stringify({
          setup: {
            model: "models/gemini-3.5-live-translate-preview",
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                automaticActivityDetection: {
                  disabled: true // Inaktiverar automatiska gissningar från Gemini
                }
              },
              translationConfig: {
                targetLanguageCode: targetLangInput.value.trim() || "en",
                echoTargetLanguage: true
              }
            }
          }
        }));
      };

      ws.onmessage = async (evt) => {
        let msg = evt.data instanceof Blob ? JSON.parse(await evt.data.text()) : JSON.parse(evt.data);

        if (msg.setupComplete) {
          statusEl.innerText = 'Status: Redo för röstinmatning (Håll in knappen)';
        }

        if (msg.serverContent?.modelTurn?.parts) {
          for (let part of msg.serverContent.modelTurn.parts) {
            if (part.text) {
              transcriptEl.innerText += part.text + " ";
            }
            if (part.inlineData?.data) {
              statusEl.innerText = 'Status: 🔊 Spelar upp översättning...';
              playAudio24kHz(part.inlineData.data);
            }
          }
        }
      };

      ws.onerror = () => { statusEl.innerText = 'Status: ❌ WebSocket-fel!'; };
      ws.onclose = () => { statusEl.innerText = 'Status: Frånkopplad.'; ws = null; };

      return true;
    }

    // 2. Starta tal (Mousedown / Touchstart)
    pttBtn.addEventListener('mousedown', async () => {
      if (!connectWebSocket()) return;

      isTalking = true;
      transcriptEl.innerText = '';
      statusEl.innerText = 'Status: 🎤 Skickar ActivityStart... (Talar)';
      pttBtn.classList.add('bg-red-600');

      // Vänta tills WebSocket är redo om den precis öppnades
      if (ws.readyState !== WebSocket.OPEN) {
        await new Promise(res => ws.addEventListener('open', res, { once: true }));
      }

      // Skicka explicit ActivityStart
      ws.send(JSON.stringify({
        realtimeInput: { activityStart: {} }
      }));

      // Starta mikrofoninsamling uten DSP
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });

      audioContext = new AudioContext();
      const inputRate = audioContext.sampleRate;
      const source = audioContext.createMediaStreamSource(mediaStream);
      
      // Buffra och skicka i chankar
      scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
      
      scriptProcessor.onaudioprocess = (e) => {
        if (!isTalking || !ws || ws.readyState !== WebSocket.OPEN) return;

        const float32 = e.inputBuffer.getChannelData(0);
        const pcm16 = convertTo16kHz(float32, inputRate);
        
        // Konvertera Int16 till Base64 och skicka
        const bytes = new Uint8Array(pcm16.buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);

        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [{
              mimeType: "audio/pcm;rate=16000",
              data: btoa(binary)
            }]
          }
        }));
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);
    });

    // 3. Avsluta tal (Mouseup / Touchend)
    async function stopTalking() {
      if (!isTalking) return;
      isTalking = false;
      pttBtn.classList.remove('bg-red-600');

      // Stäng mikrofon och audioContext
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext) await audioContext.close();

      if (ws && ws.readyState === WebSocket.OPEN) {
        statusEl.innerText = 'Status: ⏹ Skickar ActivityEnd... Väntar på svar';
        
        // Skicka explicit ActivityEnd så Gemini stänger yttrandet direkt
        ws.send(JSON.stringify({
          realtimeInput: { activityEnd: {} }
        }));
      }
    }

    pttBtn.addEventListener('mouseup', stopTalking);
    pttBtn.addEventListener('mouseleave', stopTalking);

    // Rätt resamplingsfunktion (Float32 -> 16kHz PCM16)
    function convertTo16kHz(float32, inputRate) {
      const ratio = inputRate / 16000;
      const outLen = Math.floor(float32.length / ratio);
      const pcm16 = new Int16Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const sample = float32[Math.floor(i * ratio)];
        pcm16[i] = Math.max(-1, Math.min(1, sample)) * 32767;
      }
      return pcm16;
    }

    // Spela upp 24kHz PCM16-ljud från Gemini
    function playAudio24kHz(base64Str) {
      const str = atob(base64Str);
      const bytes = new Uint8Array(str.length);
      for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
      const pcm16 = new Int16Array(bytes.buffer);

      const ctx = new AudioContext({ sampleRate: 24000 });
      const buf = ctx.createBuffer(1, pcm16.length, 24000);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < pcm16.length; i++) ch[i] = pcm16[i] / 32768.0;

      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
    }
  </script>
</body>
</html>
