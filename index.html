<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Gemini Live Translate - Hysteres VAD</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8 max-w-2xl mx-auto space-y-6 font-sans">
  <h1 class="text-xl font-bold text-blue-400">Gemini Live - Hysteres VAD (Ingen Avhuggning)</h1>

  <!-- Inställningar & Enhetsval -->
  <div class="bg-slate-800 p-4 rounded-lg space-y-3">
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Gemini API-nyckel:</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full p-2 bg-slate-700 rounded border border-slate-600 outline-none text-sm">
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Ljudkälla (NDI Webcam Input):</label>
      <div class="flex gap-2">
        <select id="deviceSelect" class="w-full p-2 bg-slate-700 rounded border border-slate-600 outline-none text-sm"></select>
        <button id="btnRefreshDevices" class="px-3 py-1 bg-slate-600 hover:bg-slate-500 text-xs rounded cursor-pointer">Sök enheter</button>
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Målspråk:</label>
      <input type="text" id="targetLang" value="en" class="w-full p-2 bg-slate-700 rounded border border-slate-600 outline-none text-sm">
    </div>
  </div>

  <!-- Huvudknapp med dynamisk status -->
  <div class="flex justify-center">
    <button id="btnToggleConnection" class="w-full py-6 bg-green-600 hover:bg-green-500 text-white font-bold text-lg rounded-xl shadow-lg transition-all cursor-pointer">
      Starta Simultanöversättning (Anslut)
    </button>
  </div>

  <!-- Status & Transkription -->
  <div class="bg-slate-800 p-4 rounded-lg space-y-2">
    <div id="status" class="text-slate-400 font-mono text-sm">Status: Ej ansluten</div>
    <div id="transcript" class="text-green-400 font-sans text-base min-h-[4rem] max-h-48 overflow-y-auto"></div>
  </div>

  <script>
    const btnToggleConnection = document.getElementById('btnToggleConnection');
    const btnRefreshDevices = document.getElementById('btnRefreshDevices');
    const deviceSelect = document.getElementById('deviceSelect');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const apiKeyInput = document.getElementById('apiKey');
    const targetLangInput = document.getElementById('targetLang');

    const ConnectionState = {
      DISCONNECTED: 'DISCONNECTED',
      CONNECTING: 'CONNECTING',
      CONNECTED: 'CONNECTED',
      DISCONNECTING: 'DISCONNECTING'
    };
    let currentState = ConnectionState.DISCONNECTED;

    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let scriptProcessor = null;

    let playbackCtx = null;
    let nextStartTime = 0;
    let activeAudioSources = [];

    // VAD-Hysteres Parametrar (från Phase 7)
    const VAD_START_THRESHOLD = 0.015; // Tröskel för att starta tal
    const VAD_CONTINUE_THRESHOLD = 0.005; // Lägre tröskel för att behålla tal (Hysteres)
    const HANGOVER_TIME_MS = 1000; // Vänta 1 sekund under pauser innan tal anses stängt
    let lastSpeechTimestamp = 0;
    let isSpeechActive = false;

    async function loadAudioDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(d => d.kind === 'audioinput');
        
        deviceSelect.innerHTML = '';
        audioInputs.forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.text = d.label || `Ljudenhet ${i + 1}`;
          if (d.label.toLowerCase().includes('ndi') || d.label.toLowerCase().includes('newtek')) {
            opt.selected = true;
          }
          deviceSelect.appendChild(opt);
        });

        statusEl.innerText = `Status: Hittade ${audioInputs.length} ljudenheter. Välj NDI.`;
      } catch (err) {
        statusEl.innerText = 'Status: Kunde inte lista ljudenheter. Ge tillstånd i webbläsaren.';
      }
    }

    btnRefreshDevices.addEventListener('click', loadAudioDevices);
    loadAudioDevices();

    function setConnectionState(newState) {
      currentState = newState;
      switch (newState) {
        case ConnectionState.DISCONNECTED:
          btnToggleConnection.innerText = 'Starta Simultanöversättning (Anslut)';
          btnToggleConnection.className = 'w-full py-6 bg-green-600 hover:bg-green-500 text-white font-bold text-lg rounded-xl shadow-lg transition-all cursor-pointer';
          btnToggleConnection.disabled = false;
          statusEl.innerText = 'Status: Frånkopplad.';
          break;

        case ConnectionState.CONNECTING:
          btnToggleConnection.innerText = 'Ansluter till Gemini...';
          btnToggleConnection.className = 'w-full py-6 bg-yellow-600 text-white font-bold text-lg rounded-xl shadow-lg transition-all cursor-wait';
          btnToggleConnection.disabled = true;
          statusEl.innerText = 'Status: Upprättar anslutning...';
          break;

        case ConnectionState.CONNECTED:
          btnToggleConnection.innerText = 'Stoppa Simultanöversättning (Koppla från)';
          btnToggleConnection.className = 'w-full py-6 bg-red-600 hover:bg-red-500 text-white font-bold text-lg rounded-xl shadow-lg transition-all cursor-pointer';
          btnToggleConnection.disabled = false;
          statusEl.innerText = 'Status: 🔴 Live (Hysteres VAD aktiv)';
          break;

        case ConnectionState.DISCONNECTING:
          btnToggleConnection.innerText = 'Kopplar från...';
          btnToggleConnection.className = 'w-full py-6 bg-slate-700 text-slate-400 font-bold text-lg rounded-xl shadow-lg transition-all cursor-wait';
          btnToggleConnection.disabled = true;
          statusEl.innerText = 'Status: Stänger strömmar...';
          break;
      }
    }

    btnToggleConnection.addEventListener('click', () => {
      if (currentState === ConnectionState.DISCONNECTED) {
        startTranslationPipeline();
      } else if (currentState === ConnectionState.CONNECTED) {
        stopTranslationPipeline();
      }
    });

    async function startTranslationPipeline() {
      const key = apiKeyInput.value.trim();
      if (!key) return alert('Ange din Gemini API-nyckel!');

      setConnectionState(ConnectionState.CONNECTING);

      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${key}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          setup: {
            model: "models/gemini-3.5-live-translate-preview",
            generationConfig: {
              responseModalities: ["AUDIO"],
              translationConfig: {
                targetLanguageCode: targetLangInput.value.trim() || "en",
                echoTargetLanguage: false
              }
            }
          }
        }));
      };

      ws.onmessage = async (evt) => {
        let msg = evt.data instanceof Blob ? JSON.parse(await evt.data.text()) : JSON.parse(evt.data);

        if (msg.setupComplete) {
          await startMicStreaming();
          setConnectionState(ConnectionState.CONNECTED);
        }

        if (msg.serverContent?.modelTurn?.parts) {
          for (let part of msg.serverContent.modelTurn.parts) {
            if (part.text) {
              transcriptEl.innerText += part.text + " ";
              transcriptEl.scrollTop = transcriptEl.scrollHeight;
            }
            if (part.inlineData?.data) {
              queueAudio24kHz(part.inlineData.data);
            }
          }
        }
      };

      ws.onerror = () => {
        alert('WebSocket-fel uppstod.');
        stopTranslationPipeline();
      };

      ws.onclose = () => {
        if (currentState !== ConnectionState.DISCONNECTED) {
          stopTranslationPipeline();
        }
      };
    }

    async function startMicStreaming() {
      const selectedDeviceId = deviceSelect.value;
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          deviceId: selectedDeviceId ? { exact: selectedDeviceId } : undefined,
          echoCancellation: false,
          noiseSuppression: true,
          autoGainControl: false
        }
      });

      audioContext = new AudioContext();
      const inputRate = audioContext.sampleRate;
      const source = audioContext.createMediaStreamSource(mediaStream);
      
      scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
      
scriptProcessor.onaudioprocess = (e) => {
  // Skicka endast om anslutningen är öppen
  if (currentState !== ConnectionState.CONNECTED || !ws || ws.readyState !== WebSocket.OPEN) return;

  const float32 = e.inputBuffer.getChannelData(0);
  const pcm16 = convertTo16kHz(float32, inputRate);
  
  const bytes = new Uint8Array(pcm16.buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);

  // Strömma ALLT ljud direkt till Gemini utan några lokala VAD-spärrar
  ws.send(JSON.stringify({
    realtimeInput: {
      mediaChunks: [{
        mimeType: "audio/pcm;rate=16000",
        data: btoa(binary)
      }]
    }
  }));
};

    async function stopTranslationPipeline() {
      setConnectionState(ConnectionState.DISCONNECTING);

      clearAudioQueue();

      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }

      if (scriptProcessor) {
        scriptProcessor.disconnect();
        scriptProcessor = null;
      }

      if (audioContext) {
        await audioContext.close();
        audioContext = null;
      }

      if (ws) {
        ws.onclose = null;
        ws.close();
        ws = null;
      }

      setConnectionState(ConnectionState.DISCONNECTED);
    }

    function convertTo16kHz(float32, inputRate) {
      const ratio = inputRate / 16000;
      const outLen = Math.floor(float32.length / ratio);
      const pcm16 = new Int16Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const sample = float32[Math.floor(i * ratio)];
        pcm16[i] = Math.max(-1, Math.min(1, sample)) * 32767;
      }
      return pcm16;
    }

    function queueAudio24kHz(base64Str) {
      if (!playbackCtx || playbackCtx.state === 'closed') {
        playbackCtx = new AudioContext({ sampleRate: 24000 });
        nextStartTime = playbackCtx.currentTime;
      }

      const str = atob(base64Str);
      const bytes = new Uint8Array(str.length);
      for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
      const pcm16 = new Int16Array(bytes.buffer);

      const buf = playbackCtx.createBuffer(1, pcm16.length, 24000);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < pcm16.length; i++) ch[i] = pcm16[i] / 32768.0;

      const src = playbackCtx.createBufferSource();
      src.buffer = buf;
      src.connect(playbackCtx.destination);

      const currentTime = playbackCtx.currentTime;
      if (nextStartTime < currentTime) {
        nextStartTime = currentTime + 0.04;
      }

      src.start(nextStartTime);
      nextStartTime += buf.duration;

      activeAudioSources.push(src);
      src.onended = () => {
        activeAudioSources = activeAudioSources.filter(s => s !== src);
      };
    }

    function clearAudioQueue() {
      activeAudioSources.forEach(s => {
        try { s.stop(); } catch(e){}
      });
      activeAudioSources = [];
      if (playbackCtx) nextStartTime = playbackCtx.currentTime;
    }
  </script>
</body>
</html>
